name: Generate updated CV PDF
on:
  push:
    branches: [cv-redesign-2026]
    paths:
      - public/cv.html
      - .github/workflows/sync-cv.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cv-redesign-2026
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CV rendering dependencies
        run: python -m pip install --quiet pymupdf Pillow weasyprint
      - name: Extract portrait and Telegram QR from original public CV
        shell: bash
        run: |
          python - <<'PY'
          import fitz, urllib.request, io
          from PIL import Image
          url = 'https://raw.githubusercontent.com/windymaster009/kevin.github.io/main/CV.pdf'
          data = urllib.request.urlopen(url, timeout=40).read()
          source = fitz.open(stream=data, filetype='pdf')
          images = []
          for img in source[0].get_images(full=True):
              data = source.extract_image(img[0])['image']
              im = Image.open(io.BytesIO(data)).convert('RGB')
              images.append(im)
          if len(images) < 2:
              raise RuntimeError('Original CV portrait/QR assets were not found.')
          portrait = max(images, key=lambda im: im.width * im.height)
          qr = min(images, key=lambda im: im.width * im.height)
          portrait.save('public/cv-portrait.jpg', quality=90)
          qr.save('public/cv-telegram-qr.png')
          print('CV assets:', portrait.size, qr.size)
          PY
      - name: Render 2026 CV in PDF format
        shell: bash
        run: |
          python - <<'PY'
          from weasyprint import HTML
          import fitz
          from pathlib import Path
          output = 'public/Kevin_Nhim_CV_2026.pdf'
          HTML(filename='public/cv.html').write_pdf(output)
          doc = fitz.open(output)
          assert len(doc) == 1, 'CV must fit on one A4 page; rendered ' + str(len(doc))
          text = doc[0].get_text()
          for section in ['NHIM KEVIN', 'VaultHub', 'WindyCast', 'CISA']:
              assert section in text, 'CV missing section: '+section
          print('CV PDF validated:', Path(output).stat().st_size, 'bytes')
          PY
      - name: Commit updated CV and original image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv-portrait.jpg public/cv-telegram-qr.png public/Kevin_Nhim_CV_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate CV PDF and preserve original portrait/QR"
            git fetch origin cv-redesign-2026
            git rebase origin/cv-redesign-2026
            git push origin HEAD:cv-redesign-2026
          fi
