name: Portfolio integrity check
on:
  push:
    branches: [main, portfolio-2026]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML, assets and downloadable CV
        run: |
          test -s index.html
          test -s cv.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/favicon.svg
          test -s Kevin_Nhim_CV_2026.pdf
          node --check assets/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.local = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag in ("script","link","a"):
                      ref = a.get("src") or a.get("href","")
                      if ref.startswith("./"):
                          self.local.append(ref.split("#")[0].split("?")[0])
          for page in ("index.html", "cv.html"):
              p = Links()
              p.feed(Path(page).read_text())
              for target in p.local:
                  assert Path(target).is_file(), (page, target)
          assert Path("Kevin_Nhim_CV_2026.pdf").read_bytes().startswith(b"%PDF-")
          print("All local links and the resume download are valid.")
          PY
